version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: edukad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edukad
      POSTGRES_PASSWORD: edukad_secret_password
      POSTGRES_DB: edukad_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
